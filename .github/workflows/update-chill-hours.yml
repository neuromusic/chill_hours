name: Update Chill Hours

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 3:00 AM MST
  workflow_dispatch:

concurrency:
  group: chill-hours-update
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore parquet cache
        uses: actions/cache@v4
        with:
          path: data/raw_weather.parquet
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Run chill hours script
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APPLICATION_KEY: ${{ secrets.AMBIENT_APPLICATION_KEY }}
          AMBIENT_ENDPOINT: ${{ secrets.AMBIENT_ENDPOINT }}
        run: python chill_hours.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp site/chart.js _site/
          cp data/chart_data.json _site/
          cp data/summary.json _site/

      - uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
